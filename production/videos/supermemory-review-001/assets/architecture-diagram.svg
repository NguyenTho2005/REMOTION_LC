<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" rx="24" fill="#090a0f" stroke="#232b3e" stroke-width="2"/>
  
  <!-- Header -->
  <text x="400" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#38bdf8" text-anchor="middle">SUPERMEMORY MEMORY &amp; CONTEXT ENGINE</text>
  <text x="400" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Architecture Overview &amp; Data Flow</text>

  <!-- Ingestion Node -->
  <rect x="50" y="140" width="200" height="100" rx="16" fill="#11141e" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Ingestion Layer</text>
  <text x="150" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Chats, Docs, URLs, PDFs</text>

  <!-- Arrow 1 -->
  <path d="M 250 190 L 320 190" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Core Graph & Memory Engine -->
  <rect x="320" y="120" width="200" height="140" rx="16" fill="#11141e" stroke="#8B5CF6" stroke-width="2"/>
  <text x="420" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#a78bfa" text-anchor="middle">Core Graph Engine</text>
  <text x="420" y="190" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Fact Extraction</text>
  <text x="420" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Entity Linkage</text>
  <text x="420" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#34d399" text-anchor="middle">Temporal Evolution</text>

  <!-- Arrow 2 Up -->
  <path d="M 520 160 L 590 130" stroke="#8B5CF6" stroke-width="3"/>
  <!-- Arrow 2 Down -->
  <path d="M 520 220 L 590 250" stroke="#8B5CF6" stroke-width="3"/>

  <!-- User Profile Node -->
  <rect x="590" y="80" width="180" height="90" rx="16" fill="#11141e" stroke="#10b981" stroke-width="2"/>
  <text x="680" y="120" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">User Profile (/profile)</text>
  <text x="680" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">~50ms Latency</text>

  <!-- Hybrid Search Node -->
  <rect x="590" y="210" width="180" height="90" rx="16" fill="#11141e" stroke="#0066FF" stroke-width="2"/>
  <text x="680" y="250" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">Hybrid Search</text>
  <text x="680" y="275" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Vector + BM25</text>

  <!-- Bottom MCP Banner -->
  <rect x="100" y="360" width="600" height="160" rx="20" fill="#11141e" stroke="#232b3e" stroke-width="2"/>
  <text x="400" y="405" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Model Context Protocol (MCP) Ecosystem</text>
  
  <rect x="140" y="430" width="150" height="60" rx="12" fill="#1a1f2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="215" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Cursor IDE</text>

  <rect x="325" y="430" width="150" height="60" rx="12" fill="#1a1f2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="400" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">Claude Code</text>

  <rect x="510" y="430" width="150" height="60" rx="12" fill="#1a1f2e" stroke="#34d399" stroke-width="1"/>
  <text x="585" y="465" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">Local Docker</text>
</svg>
