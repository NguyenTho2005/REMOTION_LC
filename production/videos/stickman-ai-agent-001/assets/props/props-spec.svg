<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8fafc" />
  <text x="400" y="50" text-anchor="middle" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#0f172a">REMOTION-LC VECTOR PROPS SHOWCASE</text>

  <!-- Laptop & Desk -->
  <g transform="translate(60, 100)">
    <rect x="0" y="80" width="200" height="12" rx="3" fill="#475569" stroke="#0f172a" stroke-width="4" />
    <polygon points="40,78 50,30 150,30 140,78" fill="#0f172a" />
    <polygon points="44,74 52,34 146,34 138,74" fill="#38bdf8" />
    <text x="100" y="125" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b">Desk &amp; Laptop</text>
  </g>

  <!-- Fast Clock -->
  <g transform="translate(320, 100)">
    <circle cx="60" cy="50" r="40" fill="#ffffff" stroke="#0f172a" stroke-width="6" />
    <line x1="60" y1="50" x2="60" y2="25" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="50" x2="80" y2="50" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <text x="60" y="125" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b">Fast Spinning Clock</text>
  </g>

  <!-- Companion Robot -->
  <g transform="translate(560, 80)">
    <rect x="20" y="20" width="70" height="74" rx="24" fill="#f8fafc" stroke="#0f172a" stroke-width="6" />
    <rect x="28" y="32" width="54" height="38" rx="12" fill="#0f172a" />
    <path d="M 38 48 Q 43 40 48 48" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 62 48 Q 67 40 72 48" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
    <line x1="55" y1="20" x2="55" y2="0" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <circle cx="55" cy="-4" r="6" fill="#38bdf8" />
    <text x="55" y="145" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b">Companion AI Robot</text>
  </g>

  <!-- Approve Button -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="220" height="60" rx="16" fill="#10b981" stroke="#059669" stroke-width="4" />
    <text x="110" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">✔ APPROVED</text>
    <text x="110" y="95" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b">Human Approval Button</text>
  </g>

  <!-- Warning Sign -->
  <g transform="translate(420, 310)">
    <polygon points="60,0 120,95 0,95" fill="#fef2f2" stroke="#ef4444" stroke-width="6" stroke-linejoin="round" />
    <text x="60" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#ef4444">!</text>
    <text x="60" y="130" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b">Safety Guardrail Warning</text>
  </g>
</svg>
