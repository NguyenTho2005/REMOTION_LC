<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <rect width="600" height="800" fill="#f8fafc" />
  <text x="300" y="60" text-anchor="middle" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#0f172a">STICKMAN VECTOR RIG SPECIFICATION</text>
  <text x="300" y="95" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" fill="#64748b">REMOTION-LC Dynamic Skeletal Hierarchy</text>

  <!-- Stickman Rig Wireframe -->
  <g transform="translate(300, 360)">
    <!-- Shadow -->
    <ellipse cx="0" cy="250" rx="90" ry="16" fill="#000000" opacity="0.1" />

    <!-- Head -->
    <circle cx="0" cy="-60" r="42" fill="#ffffff" stroke="#0f172a" stroke-width="10" />
    <circle cx="18" cy="-65" r="5" fill="#0f172a" />
    <path d="M 12 -45 Q 20 -38 28 -46" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Spine/Torso -->
    <line x1="0" y1="-18" x2="0" y2="115" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />

    <!-- Shoulders & Arms -->
    <circle cx="0" cy="0" r="8" fill="#38bdf8" />
    <line x1="0" y1="0" x2="-65" y2="55" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <circle cx="-65" cy="55" r="7" fill="#818cf8" />
    <line x1="-65" y1="55" x2="-45" y2="110" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <circle cx="-45" cy="110" r="7" fill="#38bdf8" />

    <line x1="0" y1="0" x2="65" y2="35" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <circle cx="65" cy="35" r="7" fill="#818cf8" />
    <line x1="65" y1="35" x2="110" y2="5" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <circle cx="110" cy="5" r="7" fill="#38bdf8" />

    <!-- Hips & Legs -->
    <circle cx="0" cy="115" r="8" fill="#38bdf8" />
    <line x1="0" y1="115" x2="-25" y2="185" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <circle cx="-25" cy="185" r="7" fill="#818cf8" />
    <line x1="-25" y1="185" x2="-15" y2="250" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <line x1="-15" y1="250" x2="8" y2="250" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />

    <line x1="0" y1="115" x2="25" y2="185" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
    <circle cx="25" cy="185" r="7" fill="#818cf8" />
    <line x1="25" y1="185" x2="35" y2="250" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <line x1="35" y1="250" x2="58" y2="250" stroke="#0f172a" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Joint Legend -->
  <g transform="translate(100, 720)">
    <circle cx="20" cy="0" r="7" fill="#38bdf8" />
    <text x="36" y="6" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#334155">Primary Joints (Shoulders, Hips, Hands)</text>
    <circle cx="280" cy="0" r="7" fill="#818cf8" />
    <text x="296" y="6" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#334155">Hinge Joints (Elbows, Knees)</text>
  </g>
</svg>
